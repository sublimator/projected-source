[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Compiling the vendored Lean grammar happens in `hatch_build.py`.

[project]
name = "projected-source"
version = "0.1.0"
description = "Extract and project source code into documentation with tree-sitter"
authors = [{name = "Nicholas Dudfield"}]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "tree-sitter>=0.25",
    "tree-sitter-cpp>=0.23.4",
    "jinja2>=3.1",
    "click>=8.3",
    "rich>=14.0",
    "gitpython>=3.1.45",
    "tree-sitter-typescript>=0.23.2",
    "tree-sitter-java>=0.23.5",
    "tree-sitter-rust>=0.23.2",
    "tree-sitter-proto",
]

[project.scripts]
projected-source = "projected_source.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["projected_source"]
artifacts = ["projected_source/languages/lean_grammar/_binding*.so"]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.black]
line-length = 120

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
python_version = "3.11"
warn_return_any = false
warn_unused_ignores = true
ignore_missing_imports = true
no_implicit_optional = false

[tool.uv.sources]
tree-sitter-proto = { git = "https://github.com/coder3101/tree-sitter-proto.git", rev = "d65a18ce7c2242801f702770114ad08056c7f8c9" }

[dependency-groups]
dev = [
    "black>=25.11.0",
    "mypy>=1.18.2",
    "pytest>=9.0.1",
    "pytest-cov>=7.0.0",
    "ruff>=0.14.6",
]
