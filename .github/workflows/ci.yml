name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v5
        with:
          # Full history so tests/test_code_ref.py can resolve historical
          # commits like ce32faa it uses as ref= fixtures.
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install dependencies
        # Compiles tree-sitter-proto and tree-sitter-lean grammars from source (git deps).
        run: uv sync --dev

      - name: Lint (ruff)
        run: uv run ruff check projected_source tests

      - name: Type check (mypy)
        run: uv run mypy projected_source

      - name: Test (pytest)
        run: uv run pytest -q
