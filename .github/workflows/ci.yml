name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install dependencies
        # Compiles the tree-sitter-proto grammar from source (git dependency).
        run: uv sync --dev

      - name: Lint (ruff)
        run: uv run ruff check projected_source tests

      - name: Type check (mypy)
        run: uv run mypy projected_source

      - name: Test (pytest)
        run: uv run pytest -q
